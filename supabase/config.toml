project_id = "gflvvzkiuleeochqcdeb"

# project-stats now requires a valid Supabase JWT (platform-enforced); the
# function additionally checks for an admin/staff role in code. (B2)
[functions.project-stats]
verify_jwt = true

# cross-project-api / control-center-api are the Continuum OS ↔ Credit Guardian
# integration bridge and authenticate via a timing-safe x-api-key compare inside
# the shared handler (see _shared/creditGuardianApi.ts). verify_jwt stays false
# here ON PURPOSE — flipping it would break the OS side and MUST be coordinated
# with Lane A before changing. (B1)
[functions.cross-project-api]
verify_jwt = false

[functions.control-center-api]
verify_jwt = false

[functions.analyze-bureau-response]
verify_jwt = true

[functions.analyze-credit-report]
verify_jwt = true

[functions.backfill-credit-reports]
verify_jwt = true

[functions.ingest-credit-report]
verify_jwt = true

# guardian-mcp authenticates an enrolled agent secret (Bearer), not a Supabase
# JWT. verify_jwt stays false ON PURPOSE — the platform check would reject every
# agent call. The handler rejects a missing secret, any session JWT, and
# CREDIT_GUARDIAN_KEY. Do not point this function at the Control Center key.
[functions.guardian-mcp]
verify_jwt = false

# Enrollment is a staff session. The platform requires a JWT; the function
# also requires an admin or staff role. Agent secrets are not accepted.
[functions.guardian-mcp-enroll]
verify_jwt = true
